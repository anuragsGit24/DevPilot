name: Deploy backend

on:
  workflow_call:
    secrets: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
      AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      MIGRATION_JOB: ${{ vars.MIGRATION_JOB }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/backend:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --quiet

      - name: Update and run migration job
        run: |
          gcloud run jobs update "${MIGRATION_JOB}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --quiet
          gcloud run jobs execute "${MIGRATION_JOB}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --wait \
            --quiet
