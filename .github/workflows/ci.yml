name: CI

# Reusable workflow, called from pipeline.yml.
# Toolchain: Python 3.11 + uv (locked deps), Node 22 + npm ci.
# Keep the Python version identical to backend/Dockerfile and pyproject's requires-python.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devpilot
          POSTGRES_PASSWORD: devpilot
          POSTGRES_DB: devpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # ASSUMPTION: rename to whatever variable your app/tests read.
      DATABASE_URL: postgresql+psycopg://devpilot:devpilot@localhost:5432/devpilot_test
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend and test dependencies
        run: uv sync --locked --extra dev --no-install-project --no-build

      - name: Ruff lint
        run: .venv/bin/python -m ruff check app tests migrations

      - name: Ruff format check
        run: .venv/bin/python -m ruff format --check app tests migrations

      - name: Run backend tests and create coverage report
        run: .venv/bin/python -m pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: devpilot-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: devpilot-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run type-check

      - name: Run frontend tests and create coverage report
        run: npm run test:coverage -- --run

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: devpilot-frontend/coverage
          if-no-files-found: ignore

  backend-image:
    name: Build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: devpilot-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
