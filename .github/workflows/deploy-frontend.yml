name: Deploy frontend

on:
  workflow_call:
    secrets: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
      AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
      BACKEND_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      FRONTEND_SERVICE: ${{ vars.FRONTEND_SERVICE }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/frontend:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read backend URL
        id: backend
        run: |
          echo "url=$(gcloud run services describe "${BACKEND_SERVICE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format="value(status.url)")" >> "${GITHUB_OUTPUT}"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./devpilot-frontend
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VITE_API_URL=${{ steps.backend.outputs.url }}/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy "${FRONTEND_SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --allow-unauthenticated \
            --quiet
